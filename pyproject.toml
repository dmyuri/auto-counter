[project]
name = "auto-counter"
version = "0.1.0"
description = "Contagem e classificacao automatica de veiculos nas cameras da NitTrans"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "onnxruntime>=1.18",
    "supervision>=0.23",
    "openpyxl>=3.1.5",
    "tzdata>=2026.6",
    "streamlit>=1.66.1",
    "psutil>=7.2.2",
]

[project.scripts]
auto-counter = "auto_counter.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ultralytics>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_counter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "accuracy: validacao contra os clipes de ground truth (roda com a suite completa)",
    "perf: medicao do orcamento de tempo por frame na maquina de referencia",
]
